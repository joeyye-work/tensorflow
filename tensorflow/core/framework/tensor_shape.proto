// Protocol buffer representing the shape of tensors.

syntax = "proto3";
option cc_enable_arenas = true;
option java_outer_classname = "TensorShapeProtos";
option java_multiple_files = true;
option java_package = "org.tensorflow.framework";
option go_package = "github.com/tensorflow/tensorflow/tensorflow/go/core/framework/tensor_shape_go_proto";

package tensorflow;

// Dimensions of a tensor.
message TensorShapeProto {
  // One dimension of the tensor.
  message Dim {
    // Size of the tensor in that dimension.
    // This value must be >= -1, but values of -1 are reserved for "unknown"
    // shapes (values of -1 mean "unknown" dimension).  Certain wrappers
    // that work with TensorShapeProto may fail at runtime when deserializing
    // a TensorShapeProto containing a dim value of -1.
    int64 size = 1;

    // Optional name of the tensor dimension.
    string name = 2;
    //Only keep one symbolic expr.
    //Symbolic expression for this dimension when size == -1.
    //Allows tracking relationships between unknown dimensions.
    ExpressionProto expr = 3;
  };

  // Dimensions of the tensor, such as {"input", 30}, {"output", 40}
  // for a 30 x 40 2D tensor.  If an entry has size -1, this
  // corresponds to a dimension of unknown size. The names are
  // optional.
  //
  // The order of entries in "dim" matters: It indicates the layout of the
  // values in the tensor in-memory representation.
  //
  // The first entry in "dim" is the outermost dimension used to layout the
  // values, the last entry is the innermost dimension.  This matches the
  // in-memory layout of RowMajor Eigen tensors.
  //
  // If "dim.size()" > 0, "unknown_rank" must be false.
  repeated Dim dim = 2;

  // If true, the number of dimensions in the shape is unknown.
  //
  // If true, "dim.size()" must be 0.
  bool unknown_rank = 3;

  repeated ExpressionProto expressions = 4;

};

message ExpressionProto {
  oneof node_type {
    int32 constant_value = 1;  // cons
    int32 variable_id = 2;     // var
    AddNode add_node = 3;      // exp + exp
    SubNode sub_node = 4;      // exp - exp
    MulNode mul_node = 5;      // exp * exp
    DivNode div_node = 6;      // exp / exp
  }
}

message AddNode {
  ExpressionProto lhs = 1;
  ExpressionProto rhs = 2;
}

message SubNode {
  ExpressionProto lhs = 1;
  ExpressionProto rhs = 2;
}

message MulNode {
  ExpressionProto lhs = 1;
  ExpressionProto rhs = 2;
}

message DivNode {
  ExpressionProto lhs = 1;
  ExpressionProto rhs = 2;
}